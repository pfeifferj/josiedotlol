repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: build
        name: render static site (jinja templates -> html)
        entry: scripts/build.py
        language: script
        pass_filenames: false
        files: ^(blog/|talks/|data/|templates/|scripts/(build\.py|lib/))

      - id: validate-jsonld
        name: validate JSON-LD blocks
        entry: scripts/validate-jsonld.sh
        language: script
        pass_filenames: false
        files: \.html$
